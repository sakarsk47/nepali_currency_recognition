<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali Currency Recognition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom, #0f172a, #1e293b);
            color: white;
            font-family: 'Poppins', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .btn {
            transition: all 0.3s ease-in-out;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(to right, #06b6d4, #0284c7);
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-6">

    <!-- Hero Section -->
    <div id="home" class="text-center mt-10">
        <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-green-400">
            Nepali Currency Recognition 💵
        </h1>
        <p class="text-gray-300 text-lg mt-3">AI-powered currency recognition system for Nepali banknotes.</p>
    </div>

    <!-- Live Video Section -->
    <div class="mt-10">
        <button class="btn btn-primary" onclick="startLiveVideo()">Start Live Video 🎥</button>
        <button class="btn bg-red-500 text-white ml-4" onclick="stopLiveVideo()">Stop Live Video ❌</button>
    </div>

    <div id="videoContainer" class="glass-card mt-6 hidden">
        <h2 class="text-2xl font-semibold mb-4">Live Video Recognition</h2>
        <img id="videoFrame" class="w-full h-96 object-contain" src="">
        <p class="text-gray-300 mt-2"><strong>Detected Note:</strong> <span id="live-note" class="text-green-400">None</span></p>
    </div>

    <!-- Upload Section -->
    <div id="upload" class="glass-card mt-10 w-full max-w-lg">
        <h2 class="text-2xl font-semibold">Upload an Image</h2>
        <form id="uploadForm">
            <input type="file" id="imageInput" accept="image/*" class="border p-3 rounded-lg bg-gray-800 text-white w-full mt-4">
            <button type="submit" class="btn btn-primary mt-4">Upload & Recognize ⬆️</button>
        </form>
    </div>

    <!-- Recognized Note -->
    <div id="resultContainer" class="glass-card mt-6 w-full max-w-lg hidden">
        <h2 class="text-2xl font-semibold">Recognized Note</h2>
        <p class="text-gray-300 mt-4"><strong>Currency Note:</strong> <span id="note" class="text-green-400"></span></p>
        <audio id="speechAudio" controls class="mt-4 mx-auto w-full"></audio>
    </div>

    <script>
        function startLiveVideo() {
            fetch('/start_video').then(() => {
                document.getElementById("videoFrame").src = "/video_feed";
                document.getElementById("videoContainer").classList.remove("hidden");
            });
        }

        function stopLiveVideo() {
            fetch('/stop_video').then(() => {
                document.getElementById("videoFrame").src = "";
                document.getElementById("videoContainer").classList.add("hidden");
            });
        }

        document.getElementById("uploadForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const formData = new FormData();
            const fileInput = document.getElementById("imageInput");

            if (!fileInput.files.length) {
                alert("Please select an image file.");
                return;
            }

            formData.append("file", fileInput.files[0]);

            fetch("/upload", { method: "POST", body: formData })
                .then(response => response.text())
                .then(data => {
                    document.getElementById("note").textContent = data;
                    document.getElementById("resultContainer").classList.remove("hidden");

                    // Play Audio if available
                    let audioElement = document.getElementById("speechAudio");
                    audioElement.src = `audio/${data.split(' ')[2]}.mp3`;
                    audioElement.play().catch(error => console.error("Audio Playback Error:", error));
                })
                .catch(error => console.error("Error:", error));
        });
    </script>

</body>
</html>
